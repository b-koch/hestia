name: Build sysext images
on:
  schedule:
    - cron: '0 6 * * 6'
  pull_request:
    branches:
      - main
    paths:
      - 'sysext/**'
      - '.github/workflows/sysext.yml'
  push:
    branches:
      - main
    paths:
      - 'sysext/**'
      - '.github/workflows/sysext.yml'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build, push and sign sysext images
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # Needed to pack the relabeled rootfs into the .raw sysext image that
      # ships to hosts (see sysext/relabel-and-pack.sh).
      - name: Install erofs-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils

      # Needed to push/pull the .raw file as a plain OCI artifact -- it's
      # not a container image, just a single signed blob.
      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}

      # Needed even for plain builds: the sysext Containerfile builds
      # `FROM ghcr.io/b-koch/hestia:latest`, which is private until the
      # main image's package is flipped to public.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Build, relabel, pack, push and sign each sysext app
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euxo pipefail
          for app_dir in sysext/apps/*/; do
            app="$(basename "${app_dir}")"

            echo "=== ${app}: build ==="
            sudo -E "$(command -v just)" --justfile sysext/Justfile build "${app}" "${DEFAULT_TAG}"

            # Relabel SELinux contexts against our own image's real policy
            # and pack into an EROFS .raw image. This runs for PRs too --
            # it operates on the locally-built image tag, no registry
            # credentials needed, and validates the whole pipeline still
            # works before merge.
            echo "=== ${app}: relabel + pack ==="
            sudo -E "$(command -v just)" --justfile sysext/Justfile pack "${app}" "${DEFAULT_TAG}"

            # Pull requests only validate that every app still builds and
            # packs cleanly.
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              continue
            fi

            raw="sysext/dist/sysext-${app}-${DEFAULT_TAG}.raw"

            echo "=== ${app}: push raw sysext artifact ==="
            oras push "${IMAGE_REGISTRY}/sysext-${app}-raw:${DEFAULT_TAG}" \
              --artifact-type application/vnd.hestia.sysext.erofs \
              "${raw}:application/octet-stream" \
              > /tmp/oras-push.log
            digest="$(grep -oP 'Digest: \K.*' /tmp/oras-push.log)"

            cosign sign -y --key env://COSIGN_PRIVATE_KEY \
              "${IMAGE_REGISTRY}/sysext-${app}-raw@${digest}"
          done
