name: Update GNOME Extensions
on:
  workflow_call:
    outputs:
      commit_hash:
        description: "SHA of the commit created by the extension updater, if any"
        value: ${{ jobs.build-and-commit.outputs.commit_hash }}
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # Expose the auto-commit SHA so downstream jobs check out the freshly updated extensions.
      commit_hash: ${{ steps.auto-commit.outputs.commit_hash }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl unzip glib2.50-utils || sudo apt-get install -y libglib2.0-bin

      - name: Run extension updater
        run: bash build_files/scripts/fetch_extensions.sh

      - name: Commit changes
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore: auto-update GNOME extensions"
          file_pattern: "system_files/usr/share/gnome-shell/extensions/*"