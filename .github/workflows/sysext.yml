name: Build sysext images
on:
  push:
    branches:
      - main
    paths:
      - 'sysext/**'
      - '.github/workflows/sysext.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'sysext/**'
      - '.github/workflows/sysext.yml'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build, push and sign sysext images
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}

      # Needed even for plain builds: the sysext Containerfile builds
      # `FROM ghcr.io/b-koch/hestia:latest`, which is private until the
      # main image's package is flipped to public.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Build, push and sign each sysext app
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euxo pipefail
          for app_dir in sysext/apps/*/; do
            app="$(basename "${app_dir}")"

            echo "=== ${app} ==="
            sudo -E "$(command -v just)" --justfile sysext/Justfile build "${app}" "${DEFAULT_TAG}"

            # Pull requests only validate that every app still builds.
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              continue
            fi

            sudo -E podman push \
              --digestfile=/tmp/digestfile \
              "${IMAGE_REGISTRY}/sysext-${app}:${DEFAULT_TAG}"

            digest="$(< /tmp/digestfile)"

            cosign sign -y --key env://COSIGN_PRIVATE_KEY \
              "${IMAGE_REGISTRY}/sysext-${app}@${digest}"
          done
