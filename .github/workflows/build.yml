name: Build container image
on:
  schedule:
    - cron: '0 4 * * 6'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - '**/LICENSE'
      - '**/TODO.md'
      - 'tools/**'
      - 'sysext/**'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Determine image info and base digest
        id: image-info
        run: |
          IMAGE_NAME=$(just image_name)
          DEFAULT_TAG=$(just generate-default-tag)
          BASE_IMAGE="ghcr.io/ublue-os/bazzite-gnome:stable"
          
          # Fetch current SHA256 digest of the upstream base image
          BASE_DIGEST=$(skopeo inspect docker://$BASE_IMAGE | jq -r '.Digest')

          echo "image_name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT
          echo "default_tag=${DEFAULT_TAG}" >> $GITHUB_OUTPUT
          echo "image_registry=${IMAGE_REGISTRY,,}" >> $GITHUB_OUTPUT
          echo "base_digest=${BASE_DIGEST}" >> $GITHUB_OUTPUT

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${{ steps.image-info.outputs.image_registry }}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${{ steps.image-info.outputs.image_name }}" >> ${GITHUB_ENV}

      - name: Storage & disk diagnostics (pre-build)
        run: |
          mkdir -p /tmp/diag
          {
            echo "=== podman info (storage) ==="
            sudo podman info --format json | jq '{graphDriverName: .store.graphDriverName, graphRoot: .store.graphRoot, graphStatus: .store.graphStatus, runRoot: .store.runRoot}'
            echo
            echo "=== relevant mounts ==="
            mount | grep -E "overlay| / | /var | /home |containers"
            echo
            echo "=== disk usage ==="
            df -hT
            echo
            echo "=== block devices ==="
            lsblk -f || true
            echo
            echo "=== disk stats snapshot ==="
            cat /proc/diskstats || true
          } | tee /tmp/diag/pre-build-storage-info.log

      - name: Build Image
        id: build-image
        env:
          BASE_DIGEST: ${{ steps.image-info.outputs.base_digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/diag

          # Background sampler: capture disk I/O + free space every 15s
          # for the duration of the build so we can see if any phase
          # (e.g. layer commit) coincides with an I/O stall or throttling.
          command -v iostat >/dev/null 2>&1 || sudo apt-get install -y sysstat >/dev/null 2>&1 || true
          (
            while true; do
              echo "=== $(date -u +%FT%TZ) ==="
              if command -v iostat >/dev/null 2>&1; then
                iostat -x 1 2 2>&1 | tail -n +4
              fi
              df -h / /home 2>/dev/null
              echo
              sleep 15
            done
          ) >> /tmp/diag/build-iostat.log 2>&1 &
          MONITOR_PID=$!
          echo "monitor_pid=${MONITOR_PID}" >> "$GITHUB_OUTPUT"

          set +e
          just build \
            "${{ steps.image-info.outputs.image_name }}" \
            "${{ steps.image-info.outputs.default_tag }}" \
            "${BASE_DIGEST}"
          BUILD_EXIT=$?
          set -e

          kill "${MONITOR_PID}" 2>/dev/null || true
          wait "${MONITOR_PID}" 2>/dev/null || true

          exit "${BUILD_EXIT}"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/diag/
          retention-days: 7
          if-no-files-found: warn

      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${{ steps.image-info.outputs.image_name }} \
                        ${{ steps.image-info.outputs.default_tag }})"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${{ steps.image-info.outputs.image_name }}" \
            "${{ steps.image-info.outputs.default_tag }}" \
            "${ALIAS_TAGS}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${{ steps.image-info.outputs.image_name }}:${tag} ${IMAGE_REGISTRY}/${{ steps.image-info.outputs.image_name }}:${tag}
          done

          digest=$(< /tmp/digestfile)
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v3.1.3'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${{ steps.image-info.outputs.image_name }}@${DIGEST}