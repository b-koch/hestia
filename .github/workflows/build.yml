name: Build container image
on:
  schedule:
    - cron: '0 2 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - '**/LICENSE'
      - '**/TODO.md'
      - 'tools/**'
      - 'sysext/**'
      - '.github/workflows/update-gnome-extensions.yml'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  update-extensions:
    uses: ./.github/workflows/update-gnome-extensions.yml
    permissions:
      contents: write
      
  build_push:
    name: Build and push image
    needs: update-extensions
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Use the update-extensions commit SHA if available, falling back to the default SHA so subsequent steps checkout the latest files.
          ref: ${{ needs.update-extensions.outputs.commit_hash || github.sha }}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Determine image info and base digest
        id: image-info
        run: |
          IMAGE_NAME=$(just image_name)
          DEFAULT_TAG=$(just generate-default-tag)
          BASE_IMAGE=$(awk 'toupper($0) ~ /^FROM/ && toupper($0) !~ / AS / {print $2; exit}' Containerfile)
          echo "Using base image: ${BASE_IMAGE}"
          
          BASE_DIGEST="${BASE_IMAGE##*@}"

          echo "image_name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT
          echo "default_tag=${DEFAULT_TAG}" >> $GITHUB_OUTPUT
          echo "image_registry=${IMAGE_REGISTRY,,}" >> $GITHUB_OUTPUT
          echo "base_digest=${BASE_DIGEST}" >> $GITHUB_OUTPUT

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${{ steps.image-info.outputs.image_registry }}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${{ steps.image-info.outputs.image_name }}" >> ${GITHUB_ENV}

      - name: Build Image
        id: build-image
        env:
          BASE_DIGEST: ${{ steps.image-info.outputs.base_digest }}
        run: |
          just build \
            "${{ steps.image-info.outputs.image_name }}" \
            "${{ steps.image-info.outputs.default_tag }}" \
            "${BASE_DIGEST}"

      # https://github.com/coreos/chunkah
      - name: Rechunk with Chunkah
        id: rechunk
        run: |
          just rechunk \
            "${{ steps.image-info.outputs.image_name }}" \
            "${{ steps.image-info.outputs.default_tag }}"

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${{ steps.image-info.outputs.image_name }} \
                        ${{ steps.image-info.outputs.default_tag }})"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${{ steps.image-info.outputs.image_name }}" \
            "${{ steps.image-info.outputs.default_tag }}" \
            "${ALIAS_TAGS}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${{ steps.image-info.outputs.image_name }}:${tag} ${IMAGE_REGISTRY}/${{ steps.image-info.outputs.image_name }}:${tag}
          done

          digest=$(< /tmp/digestfile)
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v3.1.3'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${{ steps.image-info.outputs.image_name }}@${DIGEST}