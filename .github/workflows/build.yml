name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 */3 * * *'  # Runs every 3 hours
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - '**/LICENSE'
      - 'tools/**'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  check_base:
    name: Check if build is needed
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      base_digest: ${{ steps.check.outputs.base_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Determine image tags
        id: image-info
        run: |
          IMAGE_NAME=$(just image_name)
          DEFAULT_TAG=$(just generate-default-tag)
          IMAGE_REGISTRY="ghcr.io/${{ github.repository_owner }}"

          echo "image_name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT
          echo "default_tag=${DEFAULT_TAG}" >> $GITHUB_OUTPUT
          echo "image_registry=${IMAGE_REGISTRY,,}" >> $GITHUB_OUTPUT

      - name: Compare base vs custom image digest
        id: check
        run: |
          BASE_IMAGE="ghcr.io/ublue-os/bazzite-gnome:stable"
          CUSTOM_IMAGE="${{ steps.image-info.outputs.image_registry }}/${{ steps.image-info.outputs.image_name }}:${{ steps.image-info.outputs.default_tag }}"

          # Fetch current SHA256 digest of the upstream base image
          BASE_DIGEST=$(skopeo inspect docker://$BASE_IMAGE | jq -r '.Digest')
          echo "base_digest=${BASE_DIGEST}" >> $GITHUB_OUTPUT

          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "Triggered by '${{ github.event_name }}'. Forcing build."
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Scheduled run. Comparing base image digest..."

          # Read stored base digest label from the custom image manifest
          CUSTOM_BASE_DIGEST=$(skopeo inspect docker://$CUSTOM_IMAGE | jq -r '.Labels["org.opencontainers.image.base.digest"] // empty' 2>/dev/null || echo "")

          echo "Current upstream base digest: ${BASE_DIGEST}"
          echo "Stored base digest in custom: ${CUSTOM_BASE_DIGEST}"

          if [[ "$BASE_DIGEST" != "$CUSTOM_BASE_DIGEST" ]]; then
            echo "Base image digest has changed. Build required."
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "Base image digest matches. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  build_push:
    name: Build and push image
    needs: check_base
    if: needs.check_base.outputs.should_build == 'true'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
      
      - name: Disk usage before build
        run: |
          df -h
          sudo du -sh /var/tmp || true
          sudo du -sh /var/lib/containers || true

      - name: Build Image
        id: build-image
        env:
          BASE_DIGEST: ${{ needs.check_base.outputs.base_digest }}
        run: |
          sudo -E $(command -v just) build \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${BASE_DIGEST}"

      - name: Disk usage before rechunk
        run: |
          df -h
          sudo du -sh /var/tmp || true
          sudo du -sh /var/lib/containers || true

      - name: Cleanup before rechunk
        run: |
          echo "Before cleanup:"
          df -h
          sudo podman system df -v

          sudo podman builder prune -af

          echo "After cleanup:"
          df -h
          sudo podman system df

      # - name: Rechunk image
      #   id: rechunk
      #   run: |
      #     sudo -E $(command -v just) rechunk \
      #       ${IMAGE_NAME} \
      #       ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          sudo -E $(command -v just) tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            sudo -E podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v2.6.3'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}
